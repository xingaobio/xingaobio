<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="你好，我是 Xin — 小模型 · 可信数据 · 人来拍板">
<style>.leg{transform-box:fill-box;transform-origin:50% 0;animation:trot .45s ease-in-out infinite alternate}
.leg.b{animation-delay:-.45s}
@keyframes trot{from{transform:rotate(12deg)}to{transform:rotate(-12deg)}}
.tail{transform-box:fill-box;transform-origin:100% 100%;animation:wag .3s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-8deg)}to{transform:rotate(14deg)}}
.ear{transform-box:fill-box;transform-origin:50% 0;animation:flop .45s ease-in-out infinite alternate}
@keyframes flop{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}
.type{animation:type 8s steps(9) infinite}
@keyframes type{0%,45%{clip-path:inset(0 0 0 0)}50%{clip-path:inset(0 100% 0 0)}80%,100%{clip-path:inset(0 0 0 0)}}
.cur{transform:translateX(222.0px);animation:cur 8s steps(9) infinite, blink .8s step-end infinite}
@keyframes cur{0%,45%{transform:translateX(222.0px)}50%{transform:translateX(0)}80%,100%{transform:translateX(222.0px)}}
@keyframes blink{50%{opacity:0}}
.walk{animation:walk 16s linear infinite}
@keyframes walk{0%{transform:translateX(320px)}52%{transform:translateX(900px)}52.01%{transform:translateX(-200px)}100%{transform:translateX(320px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
